# the interface lives in the pyscf namespace, so mypy has to be told that the
# repository root is the base its module names resolve against; without it the same
# file is found twice, as pyscf.opentrustregion.* and as opentrustregion.*
[mypy]
explicit_package_bases = True

# PySCF ships no type information
ignore_missing_imports = True

# every function in the package, tests included, carries a full signature. This also
# rejects partially annotated ones
disallow_untyped_defs = True

# pyscf loads its submodules lazily, so mypy sees no gto, scf, dft or lo attribute on
# the package itself; skipping it resolves those to Any without affecting
# pyscf.opentrustregion, which is checked as a file passed on the command line
[mypy-pyscf]
follow_imports = skip
